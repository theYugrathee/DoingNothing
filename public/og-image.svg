<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FCFBF7"/>
  <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#E5E3DC"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>
  
  <!-- Outer Card Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="#FFFFFF" stroke="#101010" stroke-width="4"/>
  
  <!-- Tag -->
  <rect x="110" y="110" width="330" height="42" rx="21" fill="#FFD23F" stroke="#101010" stroke-width="2.5"/>
  <text x="275" y="137" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#101010" text-anchor="middle">UNEMPLOYED SINCE 2026. PROUD OF IT.</text>

  <!-- Big Title -->
  <text x="110" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="94" fill="#101010" letter-spacing="-3">I do nothing.</text>
  
  <!-- Subtitle -->
  <text x="110" y="345" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="34" fill="#66645E">Buy me a meal. Get on today's public leaderboard.</text>
  
  <!-- Bottom Neo-Brutalist Pill -->
  <rect x="110" y="420" width="340" height="74" rx="20" fill="#2F4BFF" stroke="#101010" stroke-width="3"/>
  <text x="280" y="468" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle">doingnothing.lol ⚡</text>

  <!-- Metric Tile on the right -->
  <rect x="800" y="380" width="290" height="114" rx="22" fill="#FCFBF7" stroke="#101010" stroke-width="3"/>
  <text x="830" y="425" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#66645E">VOLUNTARY MEALS</text>
  <text x="830" y="472" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#2F4BFF">$100% Honest</text>
</svg>
